<div class="container">
  <div class="action-wrapper w-100 mb-5 m-auto">
    <div class="flex align-center gap-2 mb-3 justify-between">
      <input
        pInputText
        type="search"
        class="w-100"
        [(ngModel)]="currentStudentName"
        (input)="searchStudentByName(currentStudentName)"
        placeholder="Qidiruv..."
      />

      <p-button (click)="resetFilter()"> Tozalash </p-button>
    </div>

    <select
      [value]="selectedGrade"
      (change)="filterStudentByGrade($event)"
      class="mb-3 h-[43px] rounded-md border pe-1 border-gray-300 outline-0 w-100 select-auto"
      name="getStudentByGrade"
      id="getStudentByGrade"
    >
      <option value="" disabled selected>Baho bo'yicha talabalarni olish</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>

    <div class="w-100 flex gap-2 items-center">
      <select
        [value]="selectedSubject"
        (change)="filterStudentBySubject($event)"
        class="rounded-md border w-100 h-[43px] pe-1 border-gray-300 outline-0 select-auto"
        name="getStudentbySubject"
        id="getStudentbySubject"
      >
        <option value="" disabled selected>Fan bo'yicha talabalarni olish</option>
        @for (uniqueSubject of uniqueSubjects; track $index) {
          <option [value]="uniqueSubject">{{ uniqueSubject }}</option>
        }
      </select>

      <p-button [routerLink]="'/add-edit-student'"> + </p-button>
    </div>
  </div>

  <table class="w-100 m-auto">
    <thead>
      <tr>
        <th>T/R</th>
        <th>Ismi</th>
        <th>Amal</th>
      </tr>
    </thead>
    <tbody>
      @for (student of students; track student.id; let id = $index) {
        <tr>
          <td>{{ id + 1 }}</td>
          <td>{{ student.name }}</td>
          <td>
            <button (click)="toggleStudentCard(id)" class="bg-blue-400 text-white p-1 rounded-md">
              Expand
            </button>
          </td>
        </tr>
        <tr>
          <td colspan="3">
            <app-student-card (deleteStudent)="handleDeleteStudent($event)" [student]="student" />
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">
            <p>Talabalar hali qo'shilmagan.</p>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
