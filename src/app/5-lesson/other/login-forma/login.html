<div class="login-form bg-white rounded-xl mt-5 w-2xl p-4 m-auto">
  <h2 class="text-2xl text-center mb-3">login forma</h2>

  <form class="border p-3 border-gray-300 rounded flex gap-5" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="text-xl">Username:</label>
      <input pInputText
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Username kiriting">
    </div>

    <div class="form-group">
      <label class="text-xl">Parol:</label>
      <input pInputText
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Parol kiriting">
    </div>

    <p-button type="submit" class="self-end">Kirish</p-button>
  </form>

  <div class="debug border border-gray-300 rounded mt-3 p-2">
    <p>Username: {{ username }}</p>
    <p>Password: {{ password }}</p>
  </div>
</div>
