<div class="container">
  <div class="new-container m-auto w-80">
    <div class="flex flex-col">
      @if (!inputToggle) {
        <input type="text" pInputText [(ngModel)]="timerValue" />
      } @else {
        <p class="font-bold text-2xl">
          {{ timer$ | async | appFormatTimer }}
        </p>
      }
      <p-divider />
      <div class="box flex gap-2">
        <p-button (click)="start(timerValue)">Start</p-button>
        <p-button (click)="stop()">Stop</p-button>
        <p-button (click)="reset()">Reset</p-button>
      </div>
    </div>
  </div>
</div>
